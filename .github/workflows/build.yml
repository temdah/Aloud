name: Build

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.github/**'
      - '.idea/**'
      - '.claude/**'
      - '.agents/**'
      - '.codex/**'
      - 'assets/icon-source/**'
      - 'scripts/generate-icons.js'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.github/**'
      - '.idea/**'
      - '.claude/**'
      - '.agents/**'
      - '.codex/**'
      - 'assets/icon-source/**'
      - 'scripts/generate-icons.js'
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # needed to publish the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Version resolution needs the existing release tags.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          # package.json is the version floor: raise it manually for an intended
          # minor/major release. Otherwise increment the latest released patch.
          base_version="$(node -p "require('./package.json').version")"
          latest_version="$(
            git tag --list 'v*' \
              | sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9]+)?$/\1/p' \
              | sort -Vu \
              | tail -n 1
          )"

          if [ -n "$latest_version" ]; then
            IFS=. read -r major minor patch <<< "$latest_version"
            next_patch="$major.$minor.$((patch + 1))"
            version="$(printf '%s\n%s\n' "$base_version" "$next_patch" | sort -Vu | tail -n 1)"
          else
            version="$base_version"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: $version"

      - name: Apply APK version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          node -e "const fs=require('fs'); const p='app.json'; const app=JSON.parse(fs.readFileSync(p,'utf8')); app.expo.version=process.env.RELEASE_VERSION; app.expo.android.versionCode=Number(process.env.ANDROID_VERSION_CODE); fs.writeFileSync(p, JSON.stringify(app, null, 2) + '\n');"
          echo "APK versionName=$RELEASE_VERSION versionCode=$ANDROID_VERSION_CODE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci # postinstall runs the onnxruntime + expo-audio patches

      - name: Test
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Prebuild native project
        run: npx expo prebuild --platform android --no-install # android/ is gitignored (CNG); regenerate it + apply config plugins

      - name: Configure release signing (optional)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          # With no secrets the build falls back to the committed debug key
          # (installable, not store-signed). Provide these secrets for a real key.
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            mkdir -p ~/.gradle
            {
              echo "PDFREADALOUD_RELEASE_STORE_FILE=release.keystore"
              echo "PDFREADALOUD_RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
              echo "PDFREADALOUD_RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
              echo "PDFREADALOUD_RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
            } >> ~/.gradle/gradle.properties
          fi

      - name: Build release APK (arm64)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Aloud v${{ steps.version.outputs.version }}
          make_latest: true
          files: android/app/build/outputs/apk/release/*.apk
