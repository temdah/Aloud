name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # needed to publish the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci # postinstall runs the onnxruntime + expo-audio patches

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Prebuild native project
        run: npx expo prebuild --platform android --no-install # android/ is gitignored (CNG); regenerate it + apply config plugins

      - name: Configure release signing (optional)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          # With no secrets the build falls back to the committed debug key
          # (installable, not store-signed). Provide these secrets for a real key.
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            mkdir -p ~/.gradle
            {
              echo "PDFREADALOUD_RELEASE_STORE_FILE=release.keystore"
              echo "PDFREADALOUD_RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
              echo "PDFREADALOUD_RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
              echo "PDFREADALOUD_RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
            } >> ~/.gradle/gradle.properties
          fi

      - name: Build release APK (arm64)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          prerelease: true
          files: android/app/build/outputs/apk/release/*.apk
