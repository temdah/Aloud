<!DOCTYPE html>
<html lang="">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
</head>
<body>
<script type="module">
// Headless PDF.js text extractor. Runs inside a react-native-webview loaded
// from a file:// directory that also holds pdf.min.mjs, pdf.worker.min.mjs and
// the PDF itself (staged as window.PDF_FILE, injected before content load).
// Everything is fetched as same-directory siblings (allowFileAccessFromFileURLs)
// and the library/worker are imported via blob: URLs to dodge file:// module
// CORS restrictions.

const RN = window.ReactNativeWebView;

function post(obj) {
  try { RN.postMessage(JSON.stringify(obj)); } catch (e) {}
}
function status(stage) { post({ type: 'status', stage: stage }); }

// Chromium's fetch() rejects file:// URLs; XHR honors allowFileAccessFromFileURLs
// (file:// reads report status 0 on success).
function xhrLoad(url, responseType) {
  return new Promise(function (resolve, reject) {
    const xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.responseType = responseType;
    xhr.onload = function () {
      if (xhr.status === 0 || xhr.status === 200) resolve(xhr.response);
      else reject(new Error('HTTP ' + xhr.status + ' for ' + url));
    };
    xhr.onerror = function () { reject(new Error('read failed for ' + url)); };
    xhr.send();
  });
}

// Tidy a single reconstructed line: collapse table-of-contents dot leaders
// ("Coverage . . . . 8" -> "Coverage 8") and runs of whitespace. Four-or-more
// dots (optionally space-separated) are leaders; "..." ellipses are preserved.
function normalizeLine(s) {
  return s
    .replace(/(?:\.\s*){4,}/g, ' ')
    .replace(/\s{2,}/g, ' ')
    .trim();
}

// Split a paragraph into sentences, keeping each sentence's offset relative to
// the canonical stream (base = paragraph start in canonical text).
// Boundary rules mirror src/supertonic/text/sentenceRules.ts (kept in sync by
// hand — this file can't import TS): ASCII `.?!` need a following space; CJK
// fullwidth `。！？` terminate unconditionally.
function splitSentences(text, base) {
  const out = [];
  const closers = '")]’”';
  const openers = '"\'“‘([';
  let i = 0;
  const n = text.length;
  let start = 0;
  const push = (segStart, segEnd) => {
    const seg = text.slice(segStart, segEnd);
    const lead = seg.length - seg.replace(/^\s+/, '').length;
    const core = seg.trim();
    if (!core) return;
    const s = segStart + lead;
    out.push({ text: core, charStart: base + s, charEnd: base + s + core.length });
  };
  while (i < n) {
    const c = text[i];
    // CJK fullwidth terminator: sentence-final immediately (no space convention).
    if (c === '。' || c === '！' || c === '？') {
      push(start, i + 1);
      let k = i + 1;
      while (k < n && /\s/.test(text[k])) k++;
      start = k;
      i = k;
      continue;
    }
    if (c === '.' || c === '!' || c === '?') {
      let j = i + 1;
      while (j < n && closers.indexOf(text[j]) >= 0) j++;
      let k = j;
      while (k < n && /\s/.test(text[k])) k++;
      const atEnd = k >= n;
      const nextCh = text[k];
      if (atEnd || (nextCh && (/[A-Z0-9]/.test(nextCh) || openers.indexOf(nextCh) >= 0))) {
        push(start, j);
        start = k;
        i = k;
        continue;
      }
    }
    i++;
  }
  if (start < n) push(start, n);
  return out;
}

function percentile(values, pct) {
  if (values.length === 0) return 0;
  const sorted = values.slice().sort(function (a, b) { return a - b; });
  const idx = Math.min(sorted.length - 1, Math.max(0, Math.round(pct * (sorted.length - 1))));
  return sorted[idx];
}

// A TOC entry: a long dot-leader run, OR a short dot-run immediately before a
// trailing page number (long titles leave room for only a couple of dots).
function isTocLine(raw) {
  return /(?:\.\s*){4,}/.test(raw) || /(?:\.\s*){2,}\d{1,4}\s*$/.test(raw);
}

// Split a TOC line into title + trailing page number, stripping leader dots.
function splitTocEntry(t) {
  const m = t.match(/^(.*\S)[\s.]+(\d{1,4})$/);
  if (m) return { title: m[1].replace(/[\s.]+$/, ''), target: m[2] };
  return { title: t, target: '' };
}

// Cluster collected left-edges into ascending indent "stops" (tolerance-based),
// so a line's depth is its nearest stop index, not a guessed step size.
function stopsFromLefts(lefts, bodyH) {
  if (lefts.length === 0) return [0];
  const sorted = lefts.slice().sort(function (a, b) { return a - b; });
  const tol = Math.max(bodyH * 0.6, 6);
  const stops = [sorted[0]];
  for (const x of sorted) {
    if (x - stops[stops.length - 1] > tol) stops.push(x);
  }
  return stops;
}

function levelFor(left, stops) {
  if (left === null) return 0;
  let best = 0, bestDist = Infinity;
  for (let i = 0; i < stops.length; i++) {
    const d = Math.abs(left - stops[i]);
    if (d < bestDist) { bestDist = d; best = i; }
  }
  return Math.min(3, best);
}

// Reconstruct the lines of a single page from its text items.
function linesFromItems(items) {
  const lines = [];
  let cur = '';
  let curH = 0, curY = null, curLeft = null, curRight = null;
  for (const it of items) {
    if (typeof it.str !== 'string') continue;
    const h = it.height || (it.transform ? Math.abs(it.transform[3]) : 0);
    const x = it.transform ? it.transform[4] : 0;
    const y = it.transform ? it.transform[5] : 0;
    const w = it.width || 0;
    if (cur === '') { curY = y; curLeft = x; }
    cur += it.str;
    if (h > curH) curH = h;
    if (curLeft === null || x < curLeft) curLeft = x;
    if (curRight === null || x + w > curRight) curRight = x + w;
    if (it.hasEOL) {
      lines.push({ raw: cur, height: curH, y: curY, left: curLeft, right: curRight });
      cur = ''; curH = 0; curY = null; curLeft = null; curRight = null;
    }
  }
  if (cur !== '') lines.push({ raw: cur, height: curH, y: curY, left: curLeft, right: curRight });
  return lines;
}

// Reflow one page's lines into blocks (geometry-based). `inToc` carries across
// pages; returns its updated value. Prose lines that fill the column merge; a
// short trailing line ends the paragraph. TOC/leader lines + headings stay
// discrete; bare page-number lines (footers) are dropped.
function blocksForPage(rawLines, bodyH, stops, pageNo, inToc, boilerplate) {
  const blocks = [];
  const present = rawLines.filter(function (l) { return normalizeLine(l.raw) !== ''; });
  const pageRight = percentile(present.map(function (l) { return l.right || 0; }), 0.92);
  const pageLeft = percentile(present.map(function (l) { return l.left || 0; }), 0.08);
  const shortGap = Math.max(bodyH * 2, (pageRight - pageLeft) * 0.12);
  const indentGap = bodyH * 1.2;

  let para = '';
  let paraIndent = 0;
  let prevShort = true;
  let prevY = null;
  const flush = function () {
    const t = para.trim();
    if (t) blocks.push({ kind: 'p', text: t, page: pageNo, indent: paraIndent });
    para = '';
  };

  for (const ln of rawLines) {
    const t = normalizeLine(ln.raw);
    if (t === '') { flush(); prevShort = true; prevY = null; continue; }
    // Running header/footer (recurs across pages): keep it as a separate block
    // so the viewer can show it greyed off — but it is excluded from the spoken
    // text in canonicalizePage.
    if (boilerplate && boilerplate.has(boilerKey(ln.raw))) {
      flush();
      blocks.push({ kind: 'pageHeader', text: t, page: pageNo, indent: 0 });
      prevShort = true; prevY = null;
      continue;
    }
    if (/^\d{1,4}$/.test(t)) { flush(); prevShort = true; prevY = null; continue; }

    const centered = ln.left !== null && ln.right !== null &&
      ln.left - pageLeft > indentGap && pageRight - ln.right > indentGap;
    const lvl = centered ? 0 : levelFor(ln.left, stops);

    const endsWithNumber = /\s\d{1,4}$/.test(t);
    const isToc = isTocLine(ln.raw) || (inToc && endsWithNumber && t.length <= 90);
    if (isToc) {
      const entry = splitTocEntry(t);
      let title = entry.title;
      let entryIndent = lvl;
      const stub = para.trim();
      if (stub && stub.length < 160 && !/[.!?:]$/.test(stub) && !/\d$/.test(stub)) {
        title = stub + ' ' + title;
        entryIndent = paraIndent;
        para = '';
      } else {
        flush();
      }
      blocks.push({ kind: 'toc', title: title, target: entry.target, page: pageNo, indent: entryIndent });
      prevShort = true; prevY = ln.y;
      continue;
    }

    // Headings by size OR by a strong structural prefix (Part/Module/Chapter …
    // + numeral, or dotted section numbers like "1.1 Foo") that same-size bold
    // titles miss. Structural ones must be short and not end like a sentence.
    const numberedHeading =
      /^(part|module|chapter|section|appendix|unit)\s+([ivxlcdm]+|\d+)\b/i.test(t) ||
      /^\d+\.\d+(\.\d+)*\.?\s+\p{Lu}/u.test(t);
    const isHeading =
      (bodyH > 0 && ln.height >= bodyH * 1.35 && t.length <= 80) ||
      (numberedHeading && t.length <= 100 && !/[.!?]$/.test(t));
    if (isHeading) {
      if (/^contents$|table of contents/i.test(t)) inToc = true;
      flush();
      blocks.push({ kind: 'h2', text: t, page: pageNo, indent: lvl });
      prevShort = true; prevY = ln.y;
      continue;
    }

    if (inToc && t.length > 120) inToc = false;

    const gap = prevY !== null && ln.y !== null && Math.abs(prevY - ln.y) > (ln.height || bodyH) * 1.8;
    const indented = ln.left !== null && ln.left - pageLeft > indentGap;
    if (para === '' || prevShort || indented || gap) {
      flush();
      para = t;
      paraIndent = lvl;
    } else {
      para = joinFragments(para, t);
    }
    prevShort = ln.right !== null && pageRight - ln.right > shortGap;
    prevY = ln.y;
  }
  flush();
  return { blocks: blocks, inToc: inToc };
}

// Canonical text segment + offset-bearing blocks for one page, with char
// offsets absolute to the whole stream (starting at `base`).
function canonicalizePage(blocks, base) {
  let text = '';
  const out = [];
  for (const b of blocks) {
    if (b.kind === 'h2') {
      const cs = base + text.length; text += b.text; const ce = base + text.length;
      // Sentence-final punctuation so the heading is spoken with a pause + falling
      // intonation, not run into the body. Kept outside [cs, ce) so the reader
      // shows a clean title and highlight is unaffected (mirrors documentBuilder).
      if (!/[.!?…:]$/.test(b.text)) text += '.';
      text += '\n\n';
      out.push({ kind: 'h2', text: b.text, charStart: cs, charEnd: ce, page: b.page, indent: b.indent });
    } else if (b.kind === 'toc') {
      // Shown in the reader (navigable) but NOT spoken — reading a long, page-
      // numbered table of contents aloud is noise. Zero-width in the spoken stream.
      const cs = base + text.length;
      out.push({ kind: 'toc', title: b.title, target: b.target, charStart: cs, charEnd: cs, page: b.page, indent: b.indent });
    } else if (b.kind === 'pageHeader') {
      // Shown (greyed) but never spoken: no text in the stream, zero-width range.
      const cs = base + text.length;
      out.push({ kind: 'pageHeader', text: b.text, charStart: cs, charEnd: cs, page: b.page, indent: b.indent });
    } else {
      const cs = base + text.length; text += b.text; const ce = base + text.length;
      const sentences = splitSentences(b.text, cs);
      text += '\n\n';
      out.push({ kind: 'p', sentences: sentences, charStart: cs, charEnd: ce, page: b.page, indent: b.indent });
    }
  }
  return { blocks: out, text: text };
}

// Normalized key for cross-page repetition: drop a leading/trailing page number
// and case/space noise so "Title 4" and "Title 5" compare equal.
function boilerKey(raw) {
  return normalizeLine(raw).replace(/^\d+\s+/, '').replace(/\s+\d+$/, '').trim().toLowerCase();
}

// Running headers/footers are lines that recur on most pages (the page number
// aside). Return the set of their normalized keys so they can be set apart from
// body text. Needs enough pages to tell boilerplate from real repetition.
function detectBoilerplate(pageLines) {
  const set = new Set();
  const total = pageLines.length;
  if (total < 4) return set;
  const counts = new Map();
  for (const lines of pageLines) {
    const seen = new Set();
    for (const ln of lines) {
      const k = boilerKey(ln.raw);
      if (k.length < 4 || seen.has(k)) continue;
      seen.add(k);
      counts.set(k, (counts.get(k) || 0) + 1);
    }
  }
  const threshold = Math.max(3, Math.ceil(total * 0.5));
  for (const [k, c] of counts) if (c >= threshold) set.add(k);
  return set;
}

// Terminal punctuation: a paragraph ending in one is a finished sentence and is
// NOT continued across a page break.
function endsTerminal(t) {
  return /[.!?:;…。！？'")\]]$/.test(t);
}

// Join a fragment onto an open paragraph, dehyphenating a line-break hyphen only
// when the halves form ONE word: next fragment starts lowercase, a letter sits
// before the hyphen, and the tail isn't already hyphenated. So "hyphen-"+"ation"
// glues to "hyphenation" while "state-of-"+"the-art" keeps its hyphens. When the
// paragraph doesn't end in a hyphen, join with a single space.
function joinFragments(aText, bText) {
  if (!aText.endsWith('-')) return aText + ' ' + bText;
  const stem = aText.slice(0, -1);
  const lastToken = (stem.match(/\S+$/) || [''])[0];
  const oneWord = /^\p{Ll}/u.test(bText) && /\p{L}/u.test(stem.slice(-1)) && !lastToken.includes('-');
  return oneWord ? stem + bText : aText + bText;
}

// --- Image extraction --------------------------------------------------------
// Concatenate two affine matrices [a,b,c,d,e,f] (PDF.js Util.transform order).
function mtxMul(a, b) {
  return [
    a[0] * b[0] + a[2] * b[1],
    a[1] * b[0] + a[3] * b[1],
    a[0] * b[2] + a[2] * b[3],
    a[1] * b[2] + a[3] * b[3],
    a[0] * b[4] + a[2] * b[5] + a[4],
    a[1] * b[4] + a[3] * b[5] + a[5],
  ];
}
function mtxApply(m, x, y) {
  return [m[0] * x + m[2] * y + m[4], m[1] * x + m[3] * y + m[5]];
}

// Walk the operator list, tracking the CTM (seeded with the viewport transform so
// results are in canvas pixels), and return each painted image's bounding box.
function imagePlacements(opList, base, OPS) {
  const fns = opList.fnArray;
  const args = opList.argsArray;
  let ctm = base.slice();
  const stack = [];
  const out = [];
  for (let i = 0; i < fns.length; i++) {
    const fn = fns[i];
    if (fn === OPS.save) {
      stack.push(ctm.slice());
    } else if (fn === OPS.restore) {
      if (stack.length) ctm = stack.pop();
    } else if (fn === OPS.transform) {
      ctm = mtxMul(ctm, args[i]);
    } else if (fn === OPS.paintImageXObject || fn === OPS.paintInlineImageXObject || fn === OPS.paintImageMaskXObject) {
      const c0 = mtxApply(ctm, 0, 0), c1 = mtxApply(ctm, 1, 0), c2 = mtxApply(ctm, 1, 1), c3 = mtxApply(ctm, 0, 1);
      const xs = [c0[0], c1[0], c2[0], c3[0]];
      const ys = [c0[1], c1[1], c2[1], c3[1]];
      const minX = Math.min(xs[0], xs[1], xs[2], xs[3]);
      const maxX = Math.max(xs[0], xs[1], xs[2], xs[3]);
      const minY = Math.min(ys[0], ys[1], ys[2], ys[3]);
      const maxY = Math.max(ys[0], ys[1], ys[2], ys[3]);
      out.push({ x: minX, y: minY, w: maxX - minX, h: maxY - minY });
    }
  }
  return out;
}

// Find raster images on a page and return them top-to-bottom as JPEG data URIs.
// Strategy: locate placements from the op list, render the page once to a canvas,
// then crop each placement (downscaled). Pages with no image ops cost only the
// op-list parse (no render). Best-effort: any failure yields fewer/no images.
async function extractImages(page, OPS) {
  const RENDER_SCALE = 1.5;
  const MIN_PX = 40; // skip icons/bullets/rules
  const MAX_DIM = 1000; // cap output dimension
  const MAX_PER_PAGE = 12;

  let opList;
  try {
    opList = await page.getOperatorList();
  } catch (e) {
    return [];
  }
  const fns = opList.fnArray;
  let hasImage = false;
  for (let i = 0; i < fns.length; i++) {
    const f = fns[i];
    if (f === OPS.paintImageXObject || f === OPS.paintInlineImageXObject || f === OPS.paintImageMaskXObject) {
      hasImage = true;
      break;
    }
  }
  if (!hasImage) return [];

  const viewport = page.getViewport({ scale: RENDER_SCALE });
  const rects = imagePlacements(opList, viewport.transform, OPS).filter(function (r) {
    return r.w >= MIN_PX && r.h >= MIN_PX;
  });
  if (!rects.length) return [];

  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1, Math.ceil(viewport.width));
  canvas.height = Math.max(1, Math.ceil(viewport.height));
  try {
    await page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise;
  } catch (e) {
    return [];
  }

  rects.sort(function (a, b) { return a.y - b.y; }); // reading order (top-to-bottom)
  const out = [];
  for (const r of rects) {
    if (out.length >= MAX_PER_PAGE) break;
    const x = Math.max(0, Math.floor(r.x));
    const y = Math.max(0, Math.floor(r.y));
    const w = Math.min(canvas.width - x, Math.ceil(r.w));
    const h = Math.min(canvas.height - y, Math.ceil(r.h));
    if (w < 8 || h < 8) continue;
    const scale = Math.min(1, MAX_DIM / Math.max(w, h));
    const cw = Math.max(1, Math.round(w * scale));
    const ch = Math.max(1, Math.round(h * scale));
    const crop = document.createElement('canvas');
    crop.width = cw;
    crop.height = ch;
    try {
      crop.getContext('2d').drawImage(canvas, x, y, w, h, 0, 0, cw, ch);
      out.push({ dataUri: crop.toDataURL('image/jpeg', 0.82), w: cw, h: ch });
    } catch (e) {
      // tainted/oversized — skip this one
    }
  }
  return out;
}

async function main() {
  try {
    status('loading-library');
    const libText = await xhrLoad('./pdf.min.mjs', 'text');
    const lib = await import(URL.createObjectURL(new Blob([libText], { type: 'text/javascript' })));
    const workerText = await xhrLoad('./pdf.worker.min.mjs', 'text');
    lib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([workerText], { type: 'text/javascript' }));

    status('loading-pdf');
    const pdfFile = window.PDF_FILE || 'source.pdf';
    const bytes = new Uint8Array(await xhrLoad('./' + pdfFile, 'arraybuffer'));

    status('parsing');
    // isEvalSupported:false disables the PostScript/font eval path (the class of
    // bug CVE-2024-4367 abused) — untrusted PDFs, defence in depth.
    const pdf = await lib.getDocument({ data: bytes, isEvalSupported: false }).promise;
    const pageCount = pdf.numPages;
    post({ type: 'meta', pageCount: pageCount });

    // Pass 1: parse every page's lines once and learn the body font size +
    // indent stops from the first pages (where the TOC lives).
    const FREEZE_AFTER = 12;
    const pageLines = new Array(pageCount);
    const heights = [];
    const lefts = [];
    for (let p = 1; p <= pageCount; p++) {
      const page = await pdf.getPage(p);
      const tc = await page.getTextContent();
      const lines = linesFromItems(tc.items);
      pageLines[p - 1] = lines;
      if (p <= FREEZE_AFTER) {
        for (const ln of lines) {
          if (ln.height > 0) heights.push(ln.height);
          if (ln.left !== null && normalizeLine(ln.raw) !== '') lefts.push(ln.left);
        }
      }
    }
    const hs = heights.slice().sort(function (a, b) { return a - b; });
    const bodyH = hs.length ? hs[Math.floor(hs.length / 2)] : 0;
    const stops = stopsFromLefts(lefts, bodyH);

    // Detect running headers/footers across pages so they can be set apart and
    // kept out of the spoken text.
    const boilerplate = detectBoilerplate(pageLines);

    // Pass 2a: reflow every page's lines into blocks, buffered (cheap — text
    // only). blocksForPage threads `inToc` across pages, so this runs in order.
    let inToc = false;
    const pageBlocks = new Array(pageCount);
    for (let p = 1; p <= pageCount; p++) {
      const res = blocksForPage(pageLines[p - 1], bodyH, stops, p, inToc, boilerplate);
      inToc = res.inToc;
      pageBlocks[p - 1] = res.blocks;
    }

    // Pass 2b: continue a paragraph across a page break when its last sentence
    // didn't end. A = last block of page p; B = first non-header block after it
    // (may be several pages down). Merge while A stays "open" — a paragraph can
    // span 3+ pages. Intervening running headers don't break continuity.
    for (let p = 0; p < pageCount - 1; p++) {
      const cur = pageBlocks[p];
      if (!cur || cur.length === 0) continue;
      const A = cur[cur.length - 1];
      if (A.kind !== 'p') continue;
      let q = p + 1;
      while (q < pageCount && !endsTerminal(A.text)) {
        const nextArr = pageBlocks[q];
        if (!nextArr || nextArr.length === 0) { q++; continue; }
        let bi = 0;
        while (bi < nextArr.length && nextArr[bi].kind === 'pageHeader') bi++;
        if (bi >= nextArr.length) { q++; continue; }
        const B = nextArr[bi];
        // Only merge prose that reads as a continuation: B is a paragraph AND
        // (starts lowercase OR A ended on a line-break hyphen).
        if (B.kind !== 'p' || !(/^\p{Ll}/u.test(B.text) || A.text.endsWith('-'))) break;
        A.text = joinFragments(A.text, B.text);
        nextArr.splice(bi, 1); // consumed — its text now lives in A on page p
      }
    }

    // Pass 2c: canonicalize + post each page in order (base accounting unchanged).
    // A merged paragraph lives entirely in its starting page's segment.
    let base = 0;
    for (let p = 1; p <= pageCount; p++) {
      const canon = canonicalizePage(pageBlocks[p - 1], base);
      base += canon.text.length;
      let blocks = canon.blocks;
      // Append any images on the page (after its text, in top-to-bottom order).
      // Zero-length char range at the page boundary → shown but never spoken.
      try {
        const page = await pdf.getPage(p);
        const imgs = await extractImages(page, lib.OPS);
        if (imgs.length) {
          const imageBlocks = imgs.map(function (im) {
            return { kind: 'image', dataUri: im.dataUri, width: im.w, height: im.h, charStart: base, charEnd: base, page: p, indent: 0 };
          });
          blocks = blocks.concat(imageBlocks);
        }
      } catch (e) {
        // Image extraction is best-effort; never block text on it.
      }
      post({ type: 'page', page: p, blocks: blocks, textSegment: canon.text });
    }

    post({ type: 'done' });
  } catch (e) {
    post({ type: 'error', message: (e && e.message) ? e.message : String(e) });
  }
}

main();
</script>
</body>
</html>
